name: Counter Zombie Mobile Android

on:
  push:
    branches: [feature/mobile-launcher]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build branded Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources and dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleGitDebug
      - name: Verify application name and signature
        env:
          APK_PATH: android/app/build/outputs/apk/git/debug/app-git-debug.apk
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" > apk-info.txt
          grep -F "package: name='ru.kurostreet.counterzombiemobile.test'" apk-info.txt
          grep -F "application-label:'Counter Zombie Mobile 32 players'" apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(os.environ["APK_PATH"]) as apk:
              for name in ["gfx/vgui/czm_logo.tga", "gfx/shell/strings.lst", "touch/buy.cfg"]:
                  assert apk.read("assets/" + name) == Path("3rdparty/cs16client-extras", name).read_bytes(), name
              menu_libs = [name for name in apk.namelist() if name.startswith("lib/") and name.rsplit("/", 1)[-1].startswith("libmenu_")]
              assert {name.split("/")[1] for name in menu_libs} == {"arm64-v8a", "armeabi-v7a", "x86"}, menu_libs
              for name in menu_libs:
                  library = apk.read(name)
                  assert b"Counter Zombie Mobile 32 players build %s" in library, name
                  assert b"cs16-client build %s" not in library, name
          print("Bundled branding assets and native menu branding verified for all ABIs")
          PY
          cp "$APK_PATH" CounterZombieMobile-Android-test.apk
          sha256sum CounterZombieMobile-Android-test.apk > CounterZombieMobile-Android-test.apk.sha256
      - name: Upload test APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: CounterZombieMobile-Android-test
          path: |
            CounterZombieMobile-Android-test.apk
            CounterZombieMobile-Android-test.apk.sha256
            apk-info.txt
          if-no-files-found: error
          retention-days: 30
