// Counter Zombie Mobile touch button actions (used by the touch layouts and the layout editor)

// tap to run forward, tap again to stop
alias czm_autorun "czm_autorun_on"
alias czm_autorun_on "+forward; alias czm_autorun czm_autorun_off"
alias czm_autorun_off "-forward; alias czm_autorun czm_autorun_on"

// jump and crouch at once while the button is held
alias +czm_duckjump "+jump; +duck"
alias -czm_duckjump "-jump; -duck"

// "more" button: shows and hides the rarely used buttons (names start with more_)
alias czm_more "czm_more_show"
alias czm_more_show "touch_show more_*; alias czm_more czm_more_hide"
alias czm_more_hide "touch_hide more_*; alias czm_more czm_more_show"
